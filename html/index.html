<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <title>Checkpoint 4</title>
</head>

<body>

    <main>

        <section class="hero-section">

            <div class="hero-grid">

                <figure class="hero-image">
                    <img src="../images/banner/01.jpg" alt="Vista de uma cidade com barco">
                </figure>


                <div class="hero-text">

                    <p>
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla explicabo, quo, modi quod qui atque eaque repellendus est nisi voluptate facere.
                    </p>

                    <button class="botao-saiba-mais">
                        Saiba Mais
                    </button>

                </div>

                <!-- Galeria com 3 imagens -->
                <div class="hero-gallery">

                    <figure class="hero-gallery-item">
                        <img src="../images/banner/04.jpg" alt="Rua com bancos e almofadas vermelhas">
                    </figure>

                    <figure class="hero-gallery-item">
                        <img src="../images/banner/03.jpg" alt="Casas com teto azul junto ao mar">
                    </figure>

                    <figure class="hero-gallery-item">
                        <img src="../images/banner/02.jpg" alt="Casa branca com uma árvore">
                    </figure>

                </div>

            </div>

        </section>

        <div class="gallery-grid">
 
        </div>
 
        <div class="gallery">
            <div class="column">
            <img src="../images/sea/01.jpg" alt="oceano 1">
            <img src="../images/sea/02.jpg" alt="oceano 2">
            </div>
            <div class="column offset">
            <img src="../images/sea/03.jpg" alt="oceano 3">
            <img src="../images/sea/01.jpg" alt="oceano 1">
            </div>
            <div class="column">
            <img src="../images/sea/02.jpg" alt="oceano 2">
            <img src="../images/sea/03.jpg" alt="oceano 3">
            </div>
            <div class="column offset">
            <img src="../images/sea/01.jpg" alt="oceano 1">
            <img src="../images/sea/02.jpg" alt="oceano 2">
            </div>
            <div class="column">
            <img src="../images/sea/01.jpg" alt="oceano 1">
            <img src="../images/sea/02.jpg" alt="oceano 2">
            </div>
        </div>

    </main>

</body>

</html>
